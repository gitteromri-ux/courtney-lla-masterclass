<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Courtney × Longevity Life Academy — 5 Campaign Options</title>
<style>
  :root{ --navy:#02091C; --navy2:#050E28; --blue:#1A7FFF; --sky:#7EC8FF; --card:#0E1F48; --line:#24427a; --ink:#B7C6E0; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--navy);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}

  header.top{padding:30px 20px 10px;text-align:center}
  header.top .kick{color:var(--sky);font-size:12px;letter-spacing:4px;font-weight:700;text-transform:uppercase}
  header.top h1{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
  header.top p{color:var(--ink);font-size:14px;margin-top:8px}

  /* option chooser */
  .chooser{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px}
  .chooser button{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
  .chooser button .n{color:var(--sky);margin-right:6px}
  .chooser button.on{background:var(--blue);border-color:var(--blue)}
  .chooser button:hover{border-color:var(--blue)}

  .optmeta{text-align:center;padding:4px 16px 8px;color:var(--ink);font-size:13px}
  .optmeta b{color:var(--sky);font-weight:700;letter-spacing:.04em}

  .toolbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:6px 16px 18px}
  .toolbar button{background:var(--blue);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .toolbar .ghost{background:transparent;border:1px solid var(--line);color:var(--sky)}
  .counter{color:var(--ink);font-size:13px}

  .stage{max-width:1180px;margin:0 auto;padding:0 16px}
  .opt{display:none}.opt.active{display:block}
  .slide{display:none;position:relative;width:100%;aspect-ratio:16/9;background:var(--navy);border-radius:14px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(26,127,255,.16)}
  .slide.active{display:block}
  .slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .topbar{position:absolute;top:0;left:0;right:0;height:6px;background:var(--blue);z-index:8}
  .pg{position:absolute;right:2.4%;bottom:3.4%;z-index:8;color:var(--ink);font-size:.9vw}
  .kick{font-size:1vw;letter-spacing:.34em;font-weight:800;text-transform:uppercase;color:var(--sky)}
  .h{font-weight:800;color:#fff;line-height:1.02;letter-spacing:-.015em}
  .sub{color:#E7EEFB;line-height:1.4}

  /* COVER: photo top, navy caption band bottom */
  .cvr .bg{height:58%;object-position:50% 34%}
  .cvr .band{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(180deg,rgba(2,9,28,.4),var(--navy) 34%);z-index:5;display:flex;flex-direction:column;justify-content:center;padding:0 5%}
  .cvr .kick{margin-bottom:.6vw}
  .cvr .h{font-size:4.6vw}
  .cvr .sub{font-size:1.25vw;margin-top:1vw;max-width:70%}

  /* SPLIT before/after */
  .splt{}
  .splt .head{position:absolute;top:5%;left:5%;right:5%;z-index:6}
  .splt .head .h{font-size:2.7vw;margin-top:.5vw}
  .splt .cols{position:absolute;top:26%;left:0;right:0;bottom:0;display:flex;z-index:5}
  .splt .col{flex:1;position:relative;overflow:hidden}
  .splt .col .bg{position:absolute;inset:0}
  .splt .col.solid{background:var(--navy2);display:flex;align-items:center;justify-content:center}
  .splt .col.solidcol{background:linear-gradient(160deg,#081226,#02091C);display:flex;align-items:center;justify-content:center;padding:0 8%}
  .splt .col.solidcol .solidin{text-align:center;opacity:.55}
  .splt .col.solidcol .solidin .k{font-size:.95vw;letter-spacing:.3em;font-weight:800;color:#5E76A6;text-transform:uppercase}
  .splt .col.solidcol .solidin .t{font-size:1.5vw;font-weight:600;margin-top:.7vw;color:#8FA2C6}
  .splt .divide{width:3px;background:var(--blue);z-index:6}
  .splt .lbl{position:absolute;left:6%;bottom:9%;z-index:6}
  .splt .lbl .k{font-size:.95vw;letter-spacing:.3em;font-weight:800;color:var(--sky);text-transform:uppercase}
  .splt .lbl .t{font-size:1.5vw;font-weight:700;margin-top:.5vw;color:#fff}
  .splt .scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(2,9,28,.85),rgba(2,9,28,.05) 55%)}
  .splt .listwrap{padding:0 12% 0 10%}
  .splt .li{font-size:1.5vw;color:#fff;font-weight:600;padding:.5vw 0;display:flex;gap:.7vw;align-items:baseline}
  .splt .li .d{color:var(--sky);font-size:1vw}

  /* PANEL: photo one side, navy list other */
  .pnl .bg{width:42%;object-position:60% 40%}
  .pnl.right .bg{left:auto;right:0}
  .pnl .panel{position:absolute;top:0;bottom:0;width:58%;z-index:5;padding:6.5% 5.5%;display:flex;flex-direction:column;justify-content:center}
  .pnl.left .panel{right:0}.pnl.right .panel{left:0}
  .pnl .h{font-size:3.2vw;margin:.6vw 0 2vw}
  .pnl .row{display:grid;grid-template-columns:9vw 1fr;gap:1.6vw;padding:.7vw 0}
  .pnl .row .k{font-size:1.15vw;font-weight:800;color:var(--sky)}
  .pnl .row .v{font-size:1.08vw;color:#DCE6F7;line-height:1.35}
  .pnl .stk .s{margin-bottom:1.2vw}
  .pnl .stk .sk{font-size:1.2vw;font-weight:800;color:var(--sky)}
  .pnl .stk .sv{font-size:1.05vw;color:#DCE6F7;margin-top:.25vw;line-height:1.35}

  /* CARDS: photo band top + cards */
  .crd .bg{height:44%;object-position:50% 30%}
  .crd .scrim{position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(0deg,rgba(2,9,28,.75),rgba(2,9,28,.25) 60%,rgba(2,9,28,.55));z-index:4}
  .crd .head{position:absolute;left:5%;top:7%;z-index:6}
  .crd .head .h{font-size:2.9vw;margin-top:.5vw}
  .crd .cards{position:absolute;left:5%;right:5%;top:50%;bottom:7%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vw;z-index:5}
  .crd .cc{background:linear-gradient(160deg,rgba(14,31,72,.92),rgba(6,15,38,.92));border:1px solid rgba(26,127,255,.28);border-top:3px solid var(--blue);border-radius:.7vw;padding:1.3vw 1.2vw}
  .crd .cc .ct{font-size:1.3vw;font-weight:800;color:var(--sky)}
  .crd .cc .cd{font-size:.92vw;color:#DCE6F7;margin-top:.7vw;line-height:1.4}

  /* CLOSE / CTA */
  .cls .bg{object-position:50% 30%}
  .cls .grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,9,28,.72),rgba(2,9,28,.92));z-index:4}
  .cls .in{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 8%}
  .cls .h{font-size:4vw}
  .cls .sub{font-size:1.3vw;margin-top:1.2vw;max-width:64%}
  .cls .pill{margin-top:2.2vw;background:var(--blue);color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:1.05vw;padding:1vw 2.4vw;border-radius:999px;box-shadow:0 12px 34px rgba(26,127,255,.4)}
  .cls .tag{margin-top:1.6vw;color:var(--sky);font-size:.95vw;letter-spacing:.14em}

  .nav{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:18px auto 0;padding:0 16px;gap:12px}
  .nav button{background:var(--card);color:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer}
  .nav button:disabled{opacity:.35}
  .dots{display:flex;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0}
  .dot.on{background:var(--sky)}
  footer{text-align:center;color:#7C8CA8;font-size:12px;padding:32px 16px}
  @media(max-width:760px){
    header.top h1{font-size:22px}
    .cvr .h{font-size:7vw}.cvr .sub{font-size:2.4vw;max-width:92%}
    .pnl .h,.splt .head .h,.crd .head .h,.cls .h{font-size:5.4vw}
    .crd .cards{grid-template-columns:repeat(2,1fr)}
    .pnl .row .k,.pnl .row .v,.pnl .stk .sk,.pnl .stk .sv,.crd .cc .ct,.crd .cc .cd,.splt .li{font-size:2.3vw}
  }
</style>
</head>
<body>
<header class="top">
  <div class="kick">Courtney × Longevity Life Academy</div>
  <h1>Five Campaign Options</h1>
  <p>Same cinematic production language as the Julie deck — five different creative angles. Pick one.</p>
</header>

<div class="chooser" id="chooser"></div>
<div class="optmeta" id="optmeta"></div>

<div class="toolbar">
  <button id="prevTop">‹ Prev</button>
  <span class="counter"><span id="cur">1</span> / <span id="tot">5</span></span>
  <button id="nextTop">Next ›</button>
  <button class="ghost" id="fs">Fullscreen</button>
</div>

<div class="stage" id="stage"></div>

<div class="nav">
  <button id="prev">‹ Previous</button>
  <div class="dots" id="dots"></div>
  <button id="next">Next ›</button>
</div>

<footer>Confidential — prepared for the Longevity Life Academy partnership. Cinematic reference, built in the Julie production-deck language.</footer>

<script>
const IMG={cover:'images/real_cover.png',portrait:'images/real_portrait.png',closeup:'images/real_closeup.png',interview:'images/real_cover.png',
  f1:'images/real_portrait.png',f1e:'images/real_closeup.png',f2:'images/real_cover.png',f2s:'images/real_portrait.png',f3:'images/real_closeup.png',f3k:'images/real_portrait.png'};

// helpers to build slide HTML
const bar=n=>`<div class="topbar"></div><div class="pg">${n}</div>`;
function cover(img,kick,h,sub,n){return `<div class="slide cvr"><img class="bg" src="${img}">${bar(n)}<div class="band"><div class="kick">${kick}</div><div class="h">${h}</div><div class="sub">${sub}</div></div></div>`;}
function split(head,beforeImg,afterImg,bK,bT,aK,aT,n){return `<div class="slide splt">${bar(n)}<div class="head"><div class="kick">The Casting</div><div class="h">${head}</div></div><div class="cols"><div class="col solidcol"><div class="solidin"><div class="k">${bK}</div><div class="t">${bT}</div></div></div><div class="divide"></div><div class="col"><img class="bg" src="${afterImg}"><div class="scrim"></div><div class="lbl"><div class="k">${aK}</div><div class="t">${aT}</div></div></div></div></div>`;}
function panelRows(side,img,kick,h,rows,n){const r=rows.map(x=>`<div class="row"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');return `<div class="slide pnl ${side}"><img class="bg" src="${img}">${bar(n)}<div class="panel"><div class="kick">${kick}</div><div class="h">${h}</div>${r}</div></div>`;}
function panelStack(side,img,kick,h,items,n){const r=items.map(x=>`<div class="s"><div class="sk">${x[0]}</div><div class="sv">${x[1]}</div></div>`).join('');return `<div class="slide pnl ${side}"><img class="bg" src="${img}">${bar(n)}<div class="panel"><div class="kick">${kick}</div><div class="h">${h}</div><div class="stk">${r}</div></div></div>`;}
function cards(img,kick,h,cc,n){const c=cc.map(x=>`<div class="cc"><div class="ct">${x[0]}</div><div class="cd">${x[1]}</div></div>`).join('');return `<div class="slide crd"><img class="bg" src="${img}"><div class="scrim"></div>${bar(n)}<div class="head"><div class="kick">${kick}</div><div class="h">${h}</div></div><div class="cards">${c}</div></div>`;}
function close(img,h,sub,pill,tag,n){return `<div class="slide cls"><img class="bg" src="${img}"><div class="grade"></div>${bar(n)}<div class="in"><div class="h">${h}</div><div class="sub">${sub}</div><div class="pill">${pill}</div><div class="tag">${tag}</div></div></div>`;}

// ===== THE FIVE OPTIONS (each = a mini JGC-structured deck, all-new copy) =====
const OPTIONS=[
{
  name:"The Insider", tagline:"Longevity's best-kept secret finally talks.",
  slides:[
    cover(IMG.cover,"The Film","Courtney, on the record.","The film that turns a quiet longevity insider into the trusted face of the Academy — real person, real set, real authority.",1),
    split("The face changes everything.",IMG.f3,IMG.portrait,"Generic","A stock 'wellness' model.","Courtney","A real woman people believe.",2),
    panelStack("left",IMG.interview,"The Angle","The secret gets out.",[["A confession, not an ad","She says the quiet part out loud — the industry oversold it."],["Insider credibility","Framed like a documentary interview, not a commercial."],["Curiosity hook","'Here's what they never tell you' — built to be watched twice."]],3),
    panelRows("right",IMG.closeup,"The Look","Cinematic treatment.",[["Lighting","Warm practicals, soft key. Golden, never clinical."],["Camera","Shallow depth. Subject sharp, room soft."],["Palette","Wood browns, amber lamplight, deep navy shadow."],["Pace","Unhurried. Let her land the line."]],4),
    cards(IMG.interview,"Deliverables","One shoot, everywhere.",[["The film","75-sec hero film for the launch."],["Social reels","6–8 vertical cut-downs for IG & TikTok."],["Paid ads","Meta / YouTube frames from the close-ups."],["Stills","Thumbnails, press kit, article headers."]],5),
    close(IMG.cover,"Meet the insider.","One woman. One system. The story the $2M crowd doesn't want told.","Enroll Now","It's Your Life. Live It Well.",6)
  ]
},
{
  name:"The Reframe", tagline:"Not more years — better ones.",
  slides:[
    cover(IMG.portrait,"The Film","Add life to your years.","A campaign built on one idea flip: everyone sells lifespan. Courtney sells healthspan — the years you actually get to live well.",1),
    split("The right person to say it.",IMG.f2s,IMG.f2,"A slogan","'Live longer' — abstract, tired.","Courtney","Proof it can be lived, now.",2),
    panelStack("right",IMG.interview,"The Angle","Lifespan vs. healthspan.",[["The flip","Most advice adds years. She adds life to years."],["It's trainable","The one word that turns a wish into a plan."],["Aspirational, not clinical","Strong. Sharp. Free — at seventy and eighty."]],3),
    panelRows("left",IMG.closeup,"The Look","Cinematic treatment.",[["Lighting","Golden hour indoors. Optimistic warmth."],["Camera","Eye-level, intimate, shallow depth."],["Palette","Amber, ivory, deep navy shadow."],["Sound","Her voice leads; soft, hopeful score."]],4),
    cards(IMG.interview,"Deliverables","One shoot, everywhere.",[["The film","70-sec brand film for site & launch."],["Social reels","Healthspan-vs-lifespan cut-downs."],["Paid ads","Reframe hook frames for Meta."],["Stills","Lifestyle press & thumbnail library."]],5),
    close(IMG.portrait,"Don't just add years.","Add life to them — and start this week.","Enroll Now","It's Your Life. Live It Well.",6)
  ]
},
{
  name:"The Myth-Buster", tagline:"You don't need $2M to slow aging.",
  slides:[
    cover(IMG.interview,"The Film","The $2M myth, busted.","A campaign that takes on biohacking's biggest lie — that longevity is only for the rich — with a real woman and a real result.",1),
    split("The credibility swap.",IMG.f3,IMG.closeup,"A biohacker","Gadgets, plunges, hype.","Courtney","Boring, repeatable, affordable.",2),
    panelStack("left",IMG.portrait,"The Angle","Expensive noise vs. what works.",[["The enemy","Plunges, red-light rooms, 100 supplements."],["The truth","What moves the needle is cheap and repeatable."],["The proof","On a normal budget, she got the result."]],3),
    panelRows("right",IMG.closeup,"The Look","Cinematic treatment.",[["Lighting","Warm, grounded, real-home honesty."],["Camera","Handheld texture on the myth, locked on the truth."],["Palette","Navy, gold, kitchen daylight."],["Pace","Punchy on the myths, calm on the answer."]],4),
    cards(IMG.interview,"Deliverables","One shoot, everywhere.",[["The film","85-sec myth-buster hero film."],["Social reels","'Expensive noise' rapid-cut reels."],["Paid ads","Price-anchor hooks for Meta / YouTube."],["Stills","Comparison + press stills."]],5),
    close(IMG.interview,"It's closer than you think.","And far cheaper than they told you. Start this week.","Enroll Now","It's Your Life. Live It Well.",6)
  ]
},
{
  name:"The Guide", tagline:"A teacher, not a pitch.",
  slides:[
    cover(IMG.closeup,"The Film","Your longevity teacher.","A warmer, education-first campaign: Courtney as the calm guide who walks you through it, lesson by lesson.",1),
    split("The right teacher.",IMG.f1,IMG.portrait,"A spokesperson","Reading lines to camera.","Courtney","A mentor you'd actually follow.",2),
    panelStack("right",IMG.interview,"The Angle","Guided, not guessing.",[["Step by step","Energy, strength, sleep, a clear mind."],["No gimmicks","The handful of things that truly work."],["Always the next step","A path built for real life, not a second job."]],3),
    panelRows("left",IMG.portrait,"The Look","Cinematic treatment.",[["Lighting","Soft, trustworthy, classroom-warm."],["Camera","Steady, patient, close enough to trust."],["Palette","Navy, gold, paper-warm neutrals."],["Sound","Reassuring, intimate room tone."]],4),
    cards(IMG.interview,"Deliverables","One shoot, everywhere.",[["The film","75-sec 'your guide' hero film."],["Social reels","Lesson-teaser cut-downs."],["Paid ads","'Never guess again' hooks."],["Stills","Course-UI + mentor stills."]],5),
    close(IMG.closeup,"A guided path.","Lesson by lesson, with support — so you never waste time guessing.","Enroll Now","It's Your Life. Live It Well.",6)
  ]
},
{
  name:"The Two Lives", tagline:"Same birthday. Different ending.",
  slides:[
    cover(IMG.cover,"The Film","Two lives. One choice.","A high-concept campaign built on a single visual: two people, same age — and the gap that decides who stays strong far longer.",1),
    split("The face of the better path.",IMG.f1,IMG.f1e,"Decline","The curve that keeps falling.","Courtney","The curve that bends up.",2),
    panelStack("left",IMG.interview,"The Angle","Bend your trajectory.",[["The visual hook","Two curves diverging from the same start."],["Not luck","A choice — and a simple system."],["The payoff","More good years, on a normal budget."]],3),
    panelRows("right",IMG.closeup,"The Look","Cinematic treatment.",[["Lighting","Contrast: cool decline vs warm rise."],["Camera","Split framing, then land on her warmth."],["Palette","Navy, blue, gold highlight."],["Pace","Tense open, hopeful resolve."]],4),
    cards(IMG.interview,"Deliverables","One shoot, everywhere.",[["The film","75-sec 'two lives' hero film."],["Social reels","Curve-reveal cut-downs."],["Paid ads","Split-screen hook frames."],["Stills","Concept + portrait library."]],5),
    close(IMG.cover,"Which curve is yours?","The best time to bend it is this week.","Enroll Now","It's Your Life. Live It Well.",6)
  ]
}
];

const chooser=document.getElementById('chooser'),stage=document.getElementById('stage'),dots=document.getElementById('dots'),optmeta=document.getElementById('optmeta');
OPTIONS.forEach((o,oi)=>{
  const b=document.createElement('button');b.className=(oi===0?'on':'');b.innerHTML=`<span class="n">0${oi+1}</span>${o.name}`;b.onclick=()=>setOpt(oi);chooser.appendChild(b);
  const wrap=document.createElement('div');wrap.className='opt'+(oi===0?' active':'');
  wrap.innerHTML=o.slides.join('');stage.appendChild(wrap);
});
const optEls=[...stage.children],chooserEls=[...chooser.children];
let oi=0,i=0;
function slidesOf(x){return [...optEls[x].querySelectorAll('.slide')];}
function buildDots(){dots.innerHTML='';const s=slidesOf(oi);s.forEach((_,k)=>{const d=document.createElement('button');d.className='dot'+(k===0?' on':'');d.onclick=()=>go(k);dots.appendChild(d);});}
function setOpt(x){oi=x;i=0;optEls.forEach((e,k)=>e.classList.toggle('active',k===oi));chooserEls.forEach((e,k)=>e.classList.toggle('on',k===oi));
  optmeta.innerHTML=`<b>Option 0${oi+1} · ${OPTIONS[oi].name}</b> — ${OPTIONS[oi].tagline}`;
  document.getElementById('tot').textContent=slidesOf(oi).length;buildDots();go(0);}
function go(n){const s=slidesOf(oi);i=Math.max(0,Math.min(s.length-1,n));
  s.forEach((el,x)=>el.classList.toggle('active',x===i));
  [...dots.children].forEach((d,x)=>d.classList.toggle('on',x===i));
  document.getElementById('cur').textContent=i+1;
  document.getElementById('prev').disabled=document.getElementById('prevTop').disabled=(i===0);
  document.getElementById('next').disabled=document.getElementById('nextTop').disabled=(i===s.length-1);
  window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('prev').onclick=document.getElementById('prevTop').onclick=()=>go(i-1);
document.getElementById('next').onclick=document.getElementById('nextTop').onclick=()=>go(i+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)stage.requestFullscreen&&stage.requestFullscreen();else document.exitFullscreen();};
window.setOpt=setOpt;window.go=go;
setOpt(0);
</script>
</body>
</html>
